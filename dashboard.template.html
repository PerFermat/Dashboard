<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>__TITEL__</title>

<style>
:root {
    --gold: 255, 215, 0;
    --gap: 12px;          /* Abstand zwischen den Karten */
    --radius: 14px;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

/* BODY = Kopfzeile oben, Inhalt darunter */
body {
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url("__HINTERGRUNDBILD__")
        no-repeat center center fixed;
    background-size: cover;
}

/* ===== KOPFZEILE ===== */
.header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 8px 24px;
    background: rgba(0,0,0,0.55);
    border-bottom: 2px solid rgba(var(--gold), 0.8);
    position: relative;
    z-index: 10;
}

.header .title {
    grid-column: 2;
    text-align: center;
    font-size: 40px;
    color: white;
    text-shadow: 2px 2px 6px black;
}

.header .meta {
    grid-column: 3;
    justify-self: end;
    text-align: right;
    color: white;
    text-shadow: 2px 2px 6px black;
}

.clock {
    font-size: 54px;
    font-weight: bold;
    letter-spacing: 1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}

.updated {
    margin-top: 4px;
    font-size: 16px;
    opacity: 0.8;
    transition: color 0.5s ease;
}

.updated.warn {
    color: #ff8a80;
    opacity: 1;
    font-weight: bold;
}

/* ===== VERBINDUNGSHINWEIS ===== */
.warn-banner {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translate(-50%, 20px);
    padding: 10px 26px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    background: rgba(183, 28, 28, 0.92);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 2000;
}

.warn-banner.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ===== HAUPTBEREICH MIT 2 SPALTEN ===== */
.container {
    flex: 1;
    display: flex;
    width: 100%;
    min-height: 0;
}

.left {
    width: 55%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

.right {
    width: 45%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* ===== KARTEN-LOOK (alle Widgets) ===== */
.left iframe,
.right iframe {
    border: none;
    box-sizing: border-box;
    border-radius: var(--radius);
    background: rgba(8, 18, 40, 0.55);
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
}

/* Rechte Seite: Karten liegen übereinander, Höhe füllt den Rest */
.right iframe {
    position: absolute;
    top: calc(40px + var(--gap));
    left: var(--gap);
    width: calc(100% - 2 * var(--gap));
    height: calc(100% - 40px - 2 * var(--gap));
    display: none;
}

/* Linke Seite: Höhe/Abstand/Einrückung werden per JS gesetzt */
.left iframe {
    display: none;
    margin: var(--gap) var(--gap) 0 0;
    width: calc(100% - 45px - var(--gap));
}

/* ===== TITEL PRO SEITE (mit Fortschrittsbalken) ===== */
.side-title {
    position: relative;
    z-index: 10;
    height: 40px;
    line-height: 40px;
    font-size: 35px;
    color: white;
    text-shadow: 1px 1px 4px black;
    padding-left: 10px;
    background: rgba(0,0,0,0.5);
}

.progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background: rgba(255,255,255,0.15);
}

.progress .bar {
    height: 100%;
    background: rgb(var(--gold));
    box-shadow: 0 0 8px rgba(var(--gold), 0.8);
    transform-origin: left;
    transform: scaleX(0);
}

@keyframes fill {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
}

/* ===== HERVORHEBUNG DER AKTUELLEN GRUPPE ===== */
.table-overlay {
    position: absolute;
    left: 45px;
    width: calc(100% - 45px - var(--gap));
    border-radius: var(--radius);
    box-shadow:
        inset 0 0 0 4px rgba(var(--gold), 0.95),
        inset 0 0 28px rgba(var(--gold), 0.35),
        0 0 22px rgba(var(--gold), 0.6);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: top 0.6s ease, height 0.6s ease, opacity 0.5s ease;
}

.group-strip {
    position: absolute;
    left: 0;
    width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.7);
    color: black;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    border-radius: 0 var(--radius) var(--radius) 0;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
}
</style>
</head>

<body>
<div class="header">
    <div class="title" id="title"></div>
    <div class="meta">
        <div id="clock" class="clock"></div>
        <div id="updated" class="updated"></div>
    </div>
</div>

<div class="container">

<div class="left">
__LINKE_IFRAMES__
</div>

<div class="right">
__RECHTE_IFRAMES__
</div>

</div>

<div id="warnBanner" class="warn-banner">⚠ Keine aktuellen Daten – Verbindung prüfen</div>

<script>
/* Wird von erstelle-dashboard.sh aus turnier.json erzeugt */
const CONFIG = __CONFIG__;

const RIGHT_INTERVAL = CONFIG.rightInterval;   // Wechselintervall rechts
const RELOAD_INTERVAL = CONFIG.reloadInterval; // Alle Iframes neu laden
const FADE_DURATION = 800; // Dauer Fade in/out in ms
const GAP = 12;            // muss zu --gap im CSS passen
const STRIP_WIDTH = 45;    // Platz links für den Gruppenstreifen
const DIM_OPACITY = 0.45;  // Abdunklung der nicht aktuellen Tabellen

const leftEl = document.querySelector(".left");
const rightEl = document.querySelector(".right");

/* ===== TITEL ===== */
document.getElementById("title").textContent = CONFIG.titel;

function createSideTitle(parent) {
    const title = document.createElement("div");
    title.className = "side-title";
    const text = document.createElement("span");
    const progress = document.createElement("div");
    progress.className = "progress";
    const bar = document.createElement("div");
    bar.className = "bar";
    progress.appendChild(bar);
    title.append(text, progress);
    parent.prepend(title);
    return { text, bar };
}

const leftTitle = createSideTitle(leftEl);
const rightTitle = createSideTitle(rightEl);

const leftTitles = CONFIG.leftTitles;
const rightTitles = CONFIG.rightTitles;

/* Fortschrittsbalken neu starten (läuft über ms Millisekunden) */
function restartBar(bar, ms) {
    bar.style.animation = "none";
    void bar.offsetWidth; // Reflow, damit die Animation neu startet
    bar.style.animation = `fill ${ms}ms linear forwards`;
}

/* ===== OVERLAY ===== */
const overlay = document.createElement("div");
overlay.className = "table-overlay";
leftEl.appendChild(overlay);

/* ===== IFRAME SELECTION ===== */
const leftIframes = document.querySelectorAll(".left iframe");
const rightIframes = document.querySelectorAll(".right iframe");

let rightIndex = 0;
let blockIndex = 0;
let leftFading = false;

const blocks = CONFIG.blocks;

/* ===== HERVORHEBUNG: Rahmen um die aktuelle Gruppe, andere abdunkeln ===== */
function updateOverlay() {
    if (leftFading) return;

    const visible = [...leftIframes].filter(i => i.style.display !== "none");
    const tableIndex = CONFIG.rightTableIndex[rightIndex];
    const iframe = (tableIndex === null || tableIndex === undefined) ? null : leftIframes[tableIndex];
    const active = iframe && iframe.style.display !== "none" ? iframe : null;

    visible.forEach(i => { i.style.opacity = (!active || i === active) ? 1 : DIM_OPACITY; });

    if (!active) {
        overlay.style.opacity = 0;
        return;
    }

    const iframeRect = active.getBoundingClientRect();
    const leftRect = leftEl.getBoundingClientRect();
    overlay.style.top = (iframeRect.top - leftRect.top) + "px";
    overlay.style.height = iframeRect.height + "px";
    overlay.style.opacity = 1;
}

/* ===== RECHTS IFRAME WECHSEL ===== */
function showRightIframe(index) {
    rightIframes.forEach((iframe, i) => {
        iframe.style.display = "block";
        iframe.style.opacity = (i === index) ? "1" : "0";
        iframe.style.transition = "opacity 1s ease-in-out";
        iframe.style.pointerEvents = (i === index) ? "auto" : "none";
    });
}

/* START RECHTS */
if (rightIframes.length > 0) {
    showRightIframe(0);
    rightTitle.text.textContent = rightTitles[0];
    restartBar(rightTitle.bar, RIGHT_INTERVAL);
    updateOverlay();

    setInterval(() => {
        rightIndex = (rightIndex + 1) % rightIframes.length;
        showRightIframe(rightIndex);
        rightTitle.text.textContent = rightTitles[rightIndex] || "Spielplan";
        restartBar(rightTitle.bar, RIGHT_INTERVAL);
        updateOverlay();
    }, RIGHT_INTERVAL);
}

/* ===== LINKS BLOCKS MIT KORREKTER HÖHE UND GRUPPENSTREIFEN ===== */
function showLeftBlock() {
    const block = blocks[blockIndex];
    const visibleIframes = [];

    leftEl.querySelectorAll(".group-strip").forEach(s => s.remove());
    leftIframes.forEach(i => {
        i.style.display = "none";
        i.style.opacity = 0;
        i.style.pointerEvents = "none";
        i.style.transition = `opacity ${FADE_DURATION}ms ease-in-out`;
    });

    for (let i = block.from; i <= block.to && i < leftIframes.length; i++) {
        visibleIframes.push(leftIframes[i]);
    }

    // Verfügbare Höhe: Spalte minus Überschrift, geteilt durch Anzahl Karten (inkl. Abstand)
    const leftHeight = leftEl.clientHeight - 40;
    const iframeHeight = leftHeight / visibleIframes.length - GAP;

    visibleIframes.forEach((i, idx) => {
        i.style.display = "block";
        i.style.height = iframeHeight + "px";
        i.style.marginLeft = STRIP_WIDTH + "px"; // Platz für den Gruppenstreifen
        i.style.pointerEvents = "auto";
    });

    // Gruppenstreifen (nach dem Layout, damit offsetTop stimmt)
    const strips = visibleIframes.map((i, idx) => {
        const strip = document.createElement("div");
        strip.className = "group-strip";
        strip.style.top = i.offsetTop + "px";
        strip.style.height = iframeHeight + "px";
        strip.textContent = block.groups[idx] || "";
        leftEl.appendChild(strip);
        return strip;
    });

    leftTitle.text.textContent = leftTitles[blockIndex] || "Tabelle";
    restartBar(leftTitle.bar, block.duration);

    // Einblenden: erst Startzustand (opacity 0) rendern, dann Zielwerte setzen
    leftFading = false;
    void leftEl.offsetWidth;
    strips.forEach(s => { s.style.opacity = 1; });
    updateOverlay();

    // Ausblenden kurz vor Blockende, dann nächster Block
    setTimeout(() => {
        leftFading = true;
        visibleIframes.forEach(i => { i.style.opacity = 0; });
        strips.forEach(s => { s.style.opacity = 0; });
        overlay.style.opacity = 0;
        setTimeout(() => {
            blockIndex = (blockIndex + 1) % blocks.length;
            showLeftBlock();
        }, FADE_DURATION);
    }, Math.max(block.duration - FADE_DURATION, 0));
}

if (leftIframes.length > 0) showLeftBlock();

/* ===== ALLE IFRAMES REGELMÄSSIG NEU LADEN ===== */
setInterval(() => {
    leftIframes.forEach(i => { i.src = i.src; });
    rightIframes.forEach(i => { i.src = i.src; });
}, RELOAD_INTERVAL);

/* ===== UHR ===== */
function two(n) { return String(n).padStart(2, "0"); }

function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = `${two(now.getHours())}:${two(now.getMinutes())}`;
}

updateClock();
setInterval(updateClock, 1000);

/* ===== LIVE-HINWEIS & VERBINDUNGSPROBLEM =====
   Das Widget meldet nach jedem erfolgreichen Laden per postMessage seine Größe.
   Daran erkennen wir, wann zuletzt Daten ankamen. */
const WIDGET_ORIGIN = "https://www.meinturnierplan.de";
const startTime = Date.now();
let lastUpdate = null;

window.addEventListener("message", ev => {
    if (ev.origin !== WIDGET_ORIGIN) return;
    if (!ev.data || typeof ev.data.type !== "string" || !ev.data.type.startsWith("iframeSize")) return;
    lastUpdate = Date.now();
    refreshStatus();
});

function refreshStatus() {
    const updatedEl = document.getElementById("updated");
    const banner = document.getElementById("warnBanner");
    const now = Date.now();

    const offline = navigator.onLine === false;
    const neverLoaded = lastUpdate === null && now - startTime > 30000;
    const stale = lastUpdate !== null && now - lastUpdate > RELOAD_INTERVAL * 1.5;
    const problem = offline || neverLoaded || stale;

    if (lastUpdate === null) {
        updatedEl.textContent = problem ? "Keine Daten" : "Lade Daten …";
    } else {
        const d = new Date(lastUpdate);
        updatedEl.textContent = `${problem ? "Stand" : "Aktualisiert"} ${two(d.getHours())}:${two(d.getMinutes())}`;
    }
    updatedEl.classList.toggle("warn", problem);
    banner.classList.toggle("show", problem);
}

window.addEventListener("online", refreshStatus);
window.addEventListener("offline", refreshStatus);
refreshStatus();
setInterval(refreshStatus, 5000);
</script>

</body>
</html>
