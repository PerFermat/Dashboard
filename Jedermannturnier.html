<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

/* BODY = Titel oben, Inhalt darunter */
body {
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
   background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url("https://tt-hattenhofen.de/wp-content/uploads/2025/03/schlaeger.jpg")
        no-repeat center center fixed;
    background-size: cover;
}

/* Hauptbereich mit 2 Spalten */
.container {
    flex: 1;
    display: flex;
    width: 100%;
    height: 100%;
}

/* Spalten */
.left {
    width: 55%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* Spalten */

.right {
    width: 45%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}


/* Rechte Seite */
.right iframe {
    position: absolute;
    top: 40px;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
    border: none;
    display: none;
}

/* Höhe wird dynamisch per JS gesetzt */
.left iframe.active {
    display: block;
}

/* ===== LINKE SEITE (mehrere Iframes) ===== */
.left iframe {
    width: 100%;
    border: 0px solid #ccc;
    box-sizing: border-box;
    display: none;
        transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}

.left iframe.show {
    opacity: 1;
    transform: translateY(0);
}

.left iframe.hide {
    opacity: 0;
    transform: translateY(10px);
}

/* Titel */
.main-title {
    text-align: center;
    font-size: 40px;
    color: white;
    text-shadow: 2px 2px 6px black;
    padding: 10px 0;
    background: rgba(0,0,0,0.5);
}

.side-title {
    height: 40px;
    line-height: 40px;
    font-size: 35px;
    color: white;
    text-shadow: 1px 1px 4px black;
    padding-left: 10px;
    background: rgba(0,0,0,0.5);
}

/* ===== OVERLAY ===== */
.table-overlay {
    position: absolute;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0);
    box-shadow: inset 0 0 0 3px rgba(255,215,0,0.9);
    pointer-events: none;
    z-index: 10;
    display: none;
}

.clock {
    position: absolute;
    top: 6px;
    right: 20px;
    font-size: 36px;
    line-height: 1.05;
    color: white;
    font-weight: bold;
    text-shadow: 2px 2px 6px black;
    background: rgba(0,0,0,0.45);
    padding: 2px 12px 3px;
    border-radius: 8px;
    letter-spacing: 1px;
    z-index: 1000;   /* WICHTIG */
}
.table-overlay {
    box-shadow: inset 6px 0 0 rgba(255,215,0,0.95);
}

.main-title,
.side-title {
    position: relative;
    z-index: 10;
}

/* Live-Hinweis unter der Uhr */
.clock small {
    display: block;
    font-size: 12px;
    line-height: 1.1;
    font-weight: normal;
    letter-spacing: 0;
    text-align: right;
    opacity: 0.85;
}

.clock small.warn {
    color: #ff8a80;
    font-weight: bold;
    opacity: 1;
}

/* Hinweis bei Verbindungsproblem */
.warn-banner {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translate(-50%, 20px);
    padding: 10px 26px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    background: rgba(183, 28, 28, 0.92);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 2000;
}

.warn-banner.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* Fortschrittsbalken am unteren Rand jeder Spalte (dezent: hellgrau auf grau) */
.progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 4px;
    background: rgba(255,255,255,0.12);
    z-index: 20;
    pointer-events: none;
}

.progress .bar {
    height: 100%;
    background: rgba(255,255,255,0.4);
    transform-origin: left;
    transform: scaleX(0);
}

@keyframes fill {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
}


</style>

<script>
/* Wird von erstelle-dashboard.sh aus turnier.json erzeugt */
const CONFIG = {"titel":"TSGV Hattenhofen - Jedermannturnier","rightInterval":20000,"reloadInterval":180000,"leftTitles":["Tabellen Mixed","Tabelle Damen","Tabellen Herren"],"rightTitles":["Spielplan Mixed – Gruppe A","Spielplan Mixed – Gruppe B","Finalspiele Mixed","Spielplan Damen – Gruppe A","Finalspiele Damen","Spielplan Herren – Gruppe A","Spielplan Herren – Gruppe B","Spielplan Herren – Gruppe C","Finalspiele Herren"],"rightTableIndex":[0,1,null,2,null,3,4,5,null],"blocks":[{"from":0,"to":1,"duration":60000,"groups":["A","B"]},{"from":2,"to":2,"duration":40000,"groups":["A"]},{"from":3,"to":5,"duration":80000,"groups":["A","B","C"]}]};

const RIGHT_INTERVAL = CONFIG.rightInterval;   // Wechselintervall rechts
const RELOAD_INTERVAL = CONFIG.reloadInterval; // Alle Iframes neu laden
const FADE_DURATION = 800; // Dauer Fade in/out in ms

/* ===== TITEL ===== */
const mainTitle = document.createElement("div");
mainTitle.className = "main-title";
mainTitle.innerText = CONFIG.titel;
document.body.prepend(mainTitle);

function createSideTitle(parent) {
    const title = document.createElement("div");
    title.className = "side-title";
    const text = document.createElement("span");
    const progress = document.createElement("div");
    progress.className = "progress";
    const bar = document.createElement("div");
    bar.className = "bar";
    progress.appendChild(bar);
    title.append(text);
    parent.prepend(title);
    parent.appendChild(progress);
    return { text, bar };
}

const leftTitle = createSideTitle(document.querySelector(".left"));
const rightTitle = createSideTitle(document.querySelector(".right"));

/* Fortschrittsbalken neu starten (läuft über ms Millisekunden) */
function restartBar(bar, ms) {
    bar.style.animation = "none";
    void bar.offsetWidth; // Reflow, damit die Animation neu startet
    bar.style.animation = `fill ${ms}ms linear forwards`;
}

const leftTitles = CONFIG.leftTitles;
const rightTitles = CONFIG.rightTitles;

/* ===== OVERLAY ===== */
const overlay = document.createElement("div");
overlay.className = "table-overlay";
document.querySelector(".left").appendChild(overlay);

/* ===== IFRAME SELECTION ===== */
const leftIframes = document.querySelectorAll(".left iframe");
const rightIframes = document.querySelectorAll(".right iframe");

let rightIndex = 0;
let blockIndex = 0;

const blocks = CONFIG.blocks;

/* ===== OVERLAY-FUNKTION ===== */
const DIM_OPACITY = 0.55; // Deckkraft der nicht aktuellen Tabellen

function updateOverlay() {
    overlay.style.display = "none";
    const tableIndex = CONFIG.rightTableIndex[rightIndex];
    const iframe = (tableIndex === null || tableIndex === undefined) ? null : leftIframes[tableIndex];
    const active = iframe && iframe.style.display !== "none" ? iframe : null;

    // Nicht aktuelle Tabellen (und ihre Gruppenbalken) blasser darstellen
    const strips = document.querySelectorAll(".group-strip");
    [...leftIframes].filter(i => i.style.display !== "none").forEach((i, idx) => {
        const o = (!active || i === active) ? 1 : DIM_OPACITY;
        i.style.opacity = o;
        if (strips[idx]) strips[idx].style.opacity = o;
    });

    if (!active) return;

    const iframeRect = active.getBoundingClientRect();
    const leftRect = document.querySelector(".left").getBoundingClientRect();

    overlay.style.top = (iframeRect.top - leftRect.top) + "px";
    overlay.style.height = iframeRect.height + "px";
    overlay.style.display = "block";
}

/* ===== RECHTS IFRAME WECHSEL ===== */
function showRightIframe(index) {
    rightIframes.forEach((iframe, i) => {
        iframe.style.display = "block";
        iframe.style.opacity = (i === index) ? "1" : "0";
        iframe.style.transition = "opacity 1s ease-in-out";
        iframe.style.pointerEvents = (i === index) ? "auto" : "none";
    });
}

/* START RECHTS */
if (rightIframes.length > 0) {
    showRightIframe(0);
    rightTitle.text.innerText = rightTitles[0];
    restartBar(rightTitle.bar, RIGHT_INTERVAL);
    updateOverlay();

    setInterval(() => {
        rightIndex = (rightIndex + 1) % rightIframes.length;
        showRightIframe(rightIndex);
        rightTitle.text.innerText = rightTitles[rightIndex] || "Spielplan";
        restartBar(rightTitle.bar, RIGHT_INTERVAL);
        updateOverlay();
    }, RIGHT_INTERVAL);
}

/* ===== LINKS BLOCKS MIT KORREKTER HÖHE UND GRUPPENSTREIFEN ===== */
function showLeftBlock() {
    const block = blocks[blockIndex];
    const visibleIframes = [];

    leftIframes.forEach(i => {
        i.style.display = "none";
        i.style.opacity = 0;
        i.style.pointerEvents = "none";
        i.style.transition = `opacity ${FADE_DURATION}ms ease-in-out`;
        i.parentNode && i.parentNode.querySelector(".group-strip")?.remove();
    });

    for (let i = block.from; i <= block.to && i < leftIframes.length; i++) {
        visibleIframes.push(leftIframes[i]);
    }

    const leftHeight = document.querySelector('.left').clientHeight - 40; // Überschrift
    const iframeHeight = leftHeight / visibleIframes.length;

    visibleIframes.forEach((i, idx) => {
        i.style.display = "block";
        i.style.height = iframeHeight + "px";
        i.style.opacity = 1;
        i.style.pointerEvents = "auto";

        // Gruppenstreifen erstellen
        const strip = document.createElement("div");
        strip.className = "group-strip";
        strip.style.position = "absolute";
        strip.style.left = "0";
        strip.style.top = i.offsetTop + "px";
        strip.style.width = "40px";
        strip.style.height = iframeHeight + "px";
        strip.style.background = "rgba(255,255,255,0.6)";
        strip.style.color = "black";
        strip.style.fontWeight = "bold";
        strip.style.display = "flex";
        strip.style.alignItems = "center";
        strip.style.justifyContent = "center";
        strip.innerText = block.groups[idx] || "";
        strip.style.fontSize = "26px";
        strip.style.borderRadius = "0 14px 14px 0";
        strip.style.transition = "opacity 0.5s ease";
        strip.style.letterSpacing = "2px";
        strip.style.textShadow = "1px 1px 3px rgba(0,0,0,0.5)";
        document.querySelector(".left").appendChild(strip);

        // Tabelle etwas nach rechts verschieben
        i.style.marginLeft = "45px";
    });

    leftTitle.text.innerText = leftTitles[blockIndex] || "Tabelle";
    restartBar(leftTitle.bar, block.duration);
    updateOverlay();

    setTimeout(() => {
        blockIndex = (blockIndex + 1) % blocks.length;
        showLeftBlock();
    }, block.duration);
}

if (leftIframes.length > 0) showLeftBlock();

/* ===== ALLE IFRAMES ALLE 60 SEKUNDEN NEU LADEN ===== */
setInterval(() => {
    leftIframes.forEach(i => { i.src = i.src; });
    rightIframes.forEach(i => { i.src = i.src; });
}, RELOAD_INTERVAL);

function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("time").innerText = `${h}:${m}`;
}

updateClock();
setInterval(updateClock, 1000);

/* ===== LIVE-HINWEIS & VERBINDUNGSPROBLEM =====
   Das Widget meldet nach jedem erfolgreichen Laden per postMessage seine Größe.
   Daran erkennen wir, wann zuletzt Daten ankamen. */
const WIDGET_ORIGIN = "https://www.meinturnierplan.de";
const startTime = Date.now();
let lastUpdate = null;

window.addEventListener("message", ev => {
    if (ev.origin !== WIDGET_ORIGIN) return;
    if (!ev.data || typeof ev.data.type !== "string" || !ev.data.type.startsWith("iframeSize")) return;
    lastUpdate = Date.now();
    refreshStatus();
});

function refreshStatus() {
    const updatedEl = document.getElementById("updated");
    const banner = document.getElementById("warnBanner");
    const now = Date.now();

    const offline = navigator.onLine === false;
    const neverLoaded = lastUpdate === null && now - startTime > 30000;
    const stale = lastUpdate !== null && now - lastUpdate > RELOAD_INTERVAL * 1.5;
    const problem = offline || neverLoaded || stale;

    if (lastUpdate === null) {
        updatedEl.innerText = problem ? "Keine Daten" : "Lade Daten …";
    } else {
        const d = new Date(lastUpdate);
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        updatedEl.innerText = `${problem ? "Stand" : "Aktualisiert"} ${hh}:${mm}`;
    }
    updatedEl.classList.toggle("warn", problem);
    banner.classList.toggle("show", problem);
}

window.addEventListener("online", refreshStatus);
window.addEventListener("offline", refreshStatus);
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
